<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频评测</title>
  <style>
    html, body { margin: 0; background: #111; color: #fff; font-family: Arial, "Microsoft YaHei", sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; }
    video { width: 100%; max-width: 1280px; max-height: 100vh; display: block; }
    #error { padding: 24px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <video id="video" controls preload="metadata" playsinline></video>
    <div id="error" hidden>视频编号无效或视频文件未上传。</div>
  </main>
  <script>
    const trial = new URLSearchParams(location.search).get("trial") || "";
    const video = document.getElementById("video");
    const error = document.getElementById("error");
    if (!/^T\d{3}$/.test(trial)) {
      video.hidden = true;
      error.hidden = false;
    } else {
      video.src = `videos/${trial}.mp4`;
      video.onerror = () => { video.hidden = true; error.hidden = false; };
    }
  </script>
</body>
</html>
