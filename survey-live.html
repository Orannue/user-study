<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流式视频生成人工评测</title>
  <style>
    :root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#1d2733;background:#f4f6f8}body{margin:0}main{max-width:980px;margin:auto;padding:28px 18px 48px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:12px;padding:24px;box-shadow:0 2px 8px #2030400d}h1{margin:0 0 12px;font-size:25px}p{line-height:1.7}#progress{margin:22px 0 12px;color:#526170;font-weight:600}.bar{height:8px;border-radius:9px;background:#e7ecf1;overflow:hidden}.bar>div{height:100%;background:#246bce;width:0;transition:width .2s}video{width:100%;max-height:520px;background:#111;margin:18px 0;border-radius:8px}.prompt{white-space:pre-line;background:#f6f8fb;padding:14px;border-radius:8px;line-height:1.65}fieldset{border:0;padding:0;margin:22px 0 0}legend{font-weight:700;margin-bottom:9px}.options{display:flex;gap:12px}.choice{flex:1;cursor:pointer;border:1px solid #cbd5df;border-radius:8px;padding:12px 14px;text-align:center}input{margin-right:7px}button{border:0;border-radius:8px;background:#246bce;color:#fff;font-size:16px;padding:12px 24px;cursor:pointer;margin-top:26px}button:disabled{opacity:.5;cursor:not-allowed}#message{margin-top:16px;line-height:1.6}.error{color:#b42318}.hidden{display:none}
  </style>
</head>
<body><main>
  <section id="intro" class="card"><h1>流式视频生成人工评测</h1><p>本问卷随机展示 20 组视频。每组中的 A、B 仅表示显示位置，不对应固定方法。请完整观看视频，并根据题目所述目标要求，在每一项中选择表现更好的一段视频。</p><p>问卷不收集姓名、邮箱等个人信息。完成约需 15–20 分钟。</p><button id="start">开始评测</button></section>
  <section id="study" class="hidden"><div id="progress"></div><div class="bar"><div id="bar"></div></div><article class="card" style="margin-top:18px"><div id="prompt" class="prompt"></div><video id="video" controls preload="metadata" playsinline></video><form id="form"></form><button id="next" type="button">下一题</button><div id="message" aria-live="polite"></div></article></section>
</main>
<script>
const CONFIG={url:'https://sgkypeyyghmzymmcieui.supabase.co',key:'sb_publishable_1lI1fGs1ld23xFAb0FisnA_Rni79qYl'}, SIZE=20;
let trials=[],chosen=[],current=0,answers=[];const $=id=>document.getElementById(id);const participantId=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;const shuffle=xs=>xs.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function render(){const t=chosen[current];$('progress').textContent=`第 ${current+1} / ${SIZE} 题`;$('bar').style.width=`${(current+1)/SIZE*100}%`;$('prompt').textContent=t.title;$('video').src=`videos/${t.id}.mp4`;$('video').load();$('form').innerHTML=t.dimensions.map((d,i)=>`<fieldset><legend>${i+1}. ${d}</legend><div class="options"><label class="choice"><input required type="radio" name="q${i}" value="A">A 更好</label><label class="choice"><input required type="radio" name="q${i}" value="B">B 更好</label></div></fieldset>`).join('');$('next').textContent=current===SIZE-1?'提交问卷':'下一题';$('message').textContent='';window.scrollTo({top:0,behavior:'smooth'})}
async function submit(){const body={participant_id:participantId,trial_ids:chosen.map(x=>x.id),answers,user_agent:navigator.userAgent};const r=await fetch(`${CONFIG.url}/rest/v1/user_study_responses`,{method:'POST',headers:{apikey:CONFIG.key,Authorization:`Bearer ${CONFIG.key}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw Error('提交失败，请检查网络后重试。')}
$('start').onclick=async()=>{try{trials=await fetch('trials.json').then(r=>r.ok?r.json():Promise.reject())}catch{$('intro').innerHTML='<h1>问卷加载失败</h1><p>请刷新页面后重试。</p>';return}chosen=shuffle(trials).slice(0,SIZE);$('intro').classList.add('hidden');$('study').classList.remove('hidden');render()};
$('next').onclick=async()=>{const values=[...$('form').querySelectorAll('fieldset')].map((_,i)=>$('form').querySelector(`input[name="q${i}"]:checked`)?.value);if(values.some(v=>!v)){$('message').textContent='请完成本题的所有选择。';$('message').className='error';return}answers.push({trial_id:chosen[current].id,selections:values});if(++current<SIZE){render();return}$('next').disabled=true;$('message').textContent='正在提交…';try{await submit();$('study').innerHTML='<article class="card"><h1>感谢参与！</h1><p>你的答卷已匿名保存，可以关闭此页面。</p></article>'}catch(e){answers.pop();current--;$('next').disabled=false;$('message').textContent=e.message;$('message').className='error'}};
</script></body></html>
